services:
  nextsignal:
    build: .
    image: nextsignal:latest
    container_name: nextsignal
    ports:
      - "3000:3000"
    environment:
      - AUTO_SEED=true
      - BACKEND_URL=http://127.0.0.1:8000
      - NEXT_PUBLIC_BACKEND_BASE=/api/backend
    volumes:
      - nextsignal-data:/app/data
    restart: unless-stopped

volumes:
  nextsignal-data:
